name: "🎨 UX/UI 개선 건의안"
description: "온마루 사용자 경험(UX) 또는 인터페이스(UI) 디자인 개선 아이디어를 제안합니다."
title: "[UX 개선]: "
labels: ["type: ux/ui 개선 🎨"]
body:
  - type: markdown
    attributes:
      value: |
        온마루의 시각적 완성도와 사용자 경험을 향상시키기 위한 건의안을 작성해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: "현재 문제점 / 개선 배경"
      description: "어떤 화면이나 인터랙션에서 불편함이나 어색함을 느끼셨나요?"
      placeholder: "예: 한옥 3D 뷰어 전환 시 텍스트 전환이 급작스러워 시각적 몰입감이 떨어집니다."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "제안하는 개선안"
      description: "어떻게 변경하거나 어떤 인터랙션/스타일을 적용하면 더 좋을지 설명해 주세요."
      placeholder: "예: 텍스트 페이드인 시 duration을 늘리고 부드러운 blur 트랜지션을 적용하면 좋겠습니다."
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: "관련 도메인"
      description: "해당 개선안이 적용될 주요 영역을 선택해 주세요."
      options:
        - "domain: 3d-viewer 🏛️ (한옥 3D 조립 및 뷰어)"
        - "domain: animation/gsap 🎬 (스크롤 인터랙션/모션)"
        - "domain: audio/odii 🎧 (오디오 가이드/플레이어)"
        - "domain: map 🗺️ (지도 및 카카오맵)"
        - "domain: archive 📜 (한옥 아카이브/탐색)"
        - "domain: admin 🛠️ (관리자 페이지)"
        - "공통 / 디자인 시스템 (Typography, Color, Layout)"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "참고 자료 / 스크린샷 (선택)"
      description: "참고할 레퍼런스 이미지, 스케치, 타 서비스 사례 링크가 있다면 첨부해 주세요."
