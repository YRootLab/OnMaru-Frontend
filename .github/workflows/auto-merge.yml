name: Auto Merge

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - labeled
      - opened
      - synchronize
      - ready_for_review

jobs:
  Auto-Merge-Dependencies:
    name: Auto Merge Dependabot PRs
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Auto Merge
        if: github.event.pull_request.draft == false
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true

  Auto-Label-Release:
    name: Label Release-Ready PRs
    if: |
      github.base_ref == 'master' &&
      contains(github.event.pull_request.labels.*.name, 'ready-for-release')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add Release Label
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['release']
            })

      - name: Comment Release Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Ready for release. This PR will be included in the next version.'
            })
