name: Env Contract

on:
  pull_request:
    branches: [develop, main]
    paths:
      - '.env.example'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate-env-contract.mjs'
      - 'scripts/validate-env-contract.test.mjs'
      - '.github/workflows/env-contract.yml'
  push:
    branches: [develop, main]
    paths:
      - '.env.example'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate-env-contract.mjs'
      - 'scripts/validate-env-contract.test.mjs'
      - '.github/workflows/env-contract.yml'

concurrency:
  group: env-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-env-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run check:env
      - run: npx vitest run scripts/validate-env-contract.test.mjs
