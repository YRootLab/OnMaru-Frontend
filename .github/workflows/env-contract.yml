name: 환경변수 계약 검사

on:
  push:
    branches:
      - develop
      - master
    paths:
      - '.env.example'
      - '.env.local'
      - '.env.production'
      - '.github/workflows/env-contract.yml'
  pull_request:
    branches:
      - develop
      - master
    paths:
      - '.env.example'
      - '.env.local'
      - '.env.production'

jobs:
  환경변수-검사:
    name: 환경변수 계약 검증
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: .env.example 존재 여부 확인
        run: test -f .env.example || (echo ".env.example 파일이 없습니다" && exit 1)

      - name: 필수 환경변수 목록 출력
        run: |
          echo "필수 환경변수 목록:"
          grep -E '^[A-Z_]+=' .env.example | cut -d= -f1 | sort || true

      - name: .env.example 형식 검증
        run: |
          echo ".env.example 형식 검증 중..."
          while IFS= read -r line; do
            if [[ "$line" =~ ^[A-Z_]+=.* ]]; then
              echo "✓ $line"
            fi
          done < .env.example

      - name: 검사 결과 요약
        run: |
          echo "환경변수 계약 검사 통과 ✓"
          echo ""
          echo "로컬 환경변수 설정 방법:"
          echo "  cp .env.example .env.local"
          echo "  # .env.local 파일을 열어 값을 직접 입력하세요"
