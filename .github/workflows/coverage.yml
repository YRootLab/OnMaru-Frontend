name: Coverage Report

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  Coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm test -- --coverage --passWithNoTests || true

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "## Test Coverage" > coverage-summary.md
          echo "" >> coverage-summary.md

          if [ -f "coverage/coverage-summary.json" ]; then
            cat coverage/coverage-summary.json | jq '.total | to_entries[] | "\(.key): \(.value.pct)%"' >> coverage-summary.md
          else
            echo "No coverage data available" >> coverage-summary.md
          fi

      - name: Upload Coverage Summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.md

      - name: Comment Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '📊 Test Coverage Report\n\n';

            if (fs.existsSync('coverage-summary.md')) {
              body += fs.readFileSync('coverage-summary.md', 'utf8');
            } else {
              body += 'Coverage data not available';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
