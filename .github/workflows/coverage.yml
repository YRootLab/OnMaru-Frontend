name: 테스트 커버리지 리포트

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  Coverage:
    name: 테스트 커버리지 분석
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 패키지 설치
        run: npm ci

      - name: 커버리지 포함 테스트 실행
        run: npm test -- --coverage --passWithNoTests || true

      - name: 커버리지 리포트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: 커버리지 요약 생성
        if: always()
        run: |
          echo "## 테스트 커버리지 요약" > coverage-summary.md
          echo "" >> coverage-summary.md

          if [ -f "coverage/coverage-summary.json" ]; then
            cat coverage/coverage-summary.json | jq '.total | to_entries[] | "\(.key): \(.value.pct)%"' >> coverage-summary.md
          else
            echo "사용 가능한 커버리지 데이터가 없습니다." >> coverage-summary.md
          fi

      - name: 커버리지 요약 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.md

      - name: 커버리지 리포트 댓글 등록
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '📊 테스트 커버리지 리포트\n\n';

            if (fs.existsSync('coverage-summary.md')) {
              body += fs.readFileSync('coverage-summary.md', 'utf8');
            } else {
              body += '커버리지 데이터를 불러올 수 없습니다.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });