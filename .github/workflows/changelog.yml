name: Generate Changelog

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  Generate-Changelog:
    name: Update Changelog
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Previous Tag
        id: previous-tag
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^$(git describe --tags --abbrev=0)$" | head -1)
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release-notes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=${{ steps.previous-tag.outputs.tag }}

          echo "# Release $CURRENT_TAG" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%an)" >> RELEASE_NOTES.md
          else
            git log $PREV_TAG..$CURRENT_TAG --pretty=format:"- %s (%an)" >> RELEASE_NOTES.md
          fi

          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "Released: $(date -u +'%Y-%m-%d')" >> RELEASE_NOTES.md

      - name: Update CHANGELOG.md
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          {
            echo "## [$CURRENT_TAG] - $(date -u +'%Y-%m-%d')"
            echo ""
            cat RELEASE_NOTES.md
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp

          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit Changelog
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $(git describe --tags --abbrev=0)" || true
          git push origin master || true

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
