name: Slack Notifications

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - closed
  issues:
    types:
      - opened
  release:
    types:
      - published

jobs:
  Notify-Slack:
    name: Send Slack Notifications
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.action == 'opened' ||
      github.event.action == 'opened'

    steps:
      - name: Notify on Push
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            if (commits.length === 0) return;

            const message = {
              text: '🚀 New commits pushed to master',
              blocks: [
                {
                  type: 'header',
                  text: {
                    type: 'plain_text',
                    text: '📤 Push to Master'
                  }
                },
                {
                  type: 'section',
                  fields: [
                    {
                      type: 'mrkdwn',
                      text: `*Author:*\n${context.payload.pusher.name}`
                    },
                    {
                      type: 'mrkdwn',
                      text: `*Branch:*\n${context.ref.split('/').pop()}`
                    }
                  ]
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*Commits:*\n${commits.map(c => `• ${c.message.split('\n')[0]}`).join('\n')}`
                  }
                },
                {
                  type: 'actions',
                  elements: [
                    {
                      type: 'button',
                      text: {
                        type: 'plain_text',
                        text: 'View on GitHub'
                      },
                      url: context.payload.repository.html_url
                    }
                  ]
                }
              ]
            };

            console.log('Would send:', JSON.stringify(message, null, 2));

      - name: Notify on PR Open
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const message = {
              text: `🔍 New PR: ${pr.title}`,
              blocks: [
                {
                  type: 'header',
                  text: {
                    type: 'plain_text',
                    text: '📋 New Pull Request'
                  }
                },
                {
                  type: 'section',
                  fields: [
                    {
                      type: 'mrkdwn',
                      text: `*PR:*\n#${pr.number}`
                    },
                    {
                      type: 'mrkdwn',
                      text: `*Author:*\n${pr.user.login}`
                    }
                  ]
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*Title:*\n${pr.title}`
                  }
                },
                {
                  type: 'actions',
                  elements: [
                    {
                      type: 'button',
                      text: {
                        type: 'plain_text',
                        text: 'Review PR'
                      },
                      url: pr.html_url
                    }
                  ]
                }
              ]
            };

            console.log('Would send:', JSON.stringify(message, null, 2));

      - name: Notify on Issue Open
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            const message = {
              text: `📌 New Issue: ${issue.title}`,
              blocks: [
                {
                  type: 'header',
                  text: {
                    type: 'plain_text',
                    text: '🚨 New Issue'
                  }
                },
                {
                  type: 'section',
                  fields: [
                    {
                      type: 'mrkdwn',
                      text: `*Issue:*\n#${issue.number}`
                    },
                    {
                      type: 'mrkdwn',
                      text: `*Reporter:*\n${issue.user.login}`
                    }
                  ]
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*Title:*\n${issue.title}`
                  }
                },
                {
                  type: 'actions',
                  elements: [
                    {
                      type: 'button',
                      text: {
                        type: 'plain_text',
                        text: 'View Issue'
                      },
                      url: issue.html_url
                    }
                  ]
                }
              ]
            };

            console.log('Would send:', JSON.stringify(message, null, 2));

      - name: Notify on Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;

            const message = {
              text: `🎉 New Release: ${release.tag_name}`,
              blocks: [
                {
                  type: 'header',
                  text: {
                    type: 'plain_text',
                    text: '🚀 New Release Published'
                  }
                },
                {
                  type: 'section',
                  fields: [
                    {
                      type: 'mrkdwn',
                      text: `*Version:*\n${release.tag_name}`
                    },
                    {
                      type: 'mrkdwn',
                      text: `*Author:*\n${release.author.login}`
                    }
                  ]
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*Release Notes:*\n${release.body.substring(0, 200)}...`
                  }
                },
                {
                  type: 'actions',
                  elements: [
                    {
                      type: 'button',
                      text: {
                        type: 'plain_text',
                        text: 'Download'
                      },
                      url: release.html_url
                    }
                  ]
                }
              ]
            };

            console.log('Would send:', JSON.stringify(message, null, 2));

  Log-Activity:
    name: Log Activity (Alternative to Slack)
    runs-on: ubuntu-latest
    steps:
      - name: Log Event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Repository: ${{ github.repository }}"
          echo "---"
          echo "💡 Tip: To enable Slack notifications:"
          echo "1. Create a Slack Webhook URL"
          echo "2. Add it as GitHub Secret: SLACK_WEBHOOK_URL"
          echo "3. Use: slackapi/slack-github-action action"
