name: Sync to Fork Repository

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # 수동 실행 지원

jobs:
  sync:
    name: Sync Branch to Fork
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Push to Fork Repository
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: "yshls/OnMaru-Frontend"
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Syncing branch: $BRANCH_NAME to $TARGET_REPO"
          git remote add target "https://x-access-token:${SYNC_TOKEN}@github.com/${TARGET_REPO}.git"
          git push target "$BRANCH_NAME:$BRANCH_NAME" --force
