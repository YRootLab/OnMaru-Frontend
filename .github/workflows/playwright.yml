name: Playwright Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize private Core UI submodule
      env:
        CORE_UI_DEPLOY_KEY: ${{ secrets.CORE_UI_DEPLOY_KEY }}
      run: |
        test -n "$CORE_UI_DEPLOY_KEY" || { echo "CORE_UI_DEPLOY_KEY is required to read src/private/core-ui."; exit 1; }
        key_path="$RUNNER_TEMP/core-ui-deploy-key"
        printf '%s\n' "$CORE_UI_DEPLOY_KEY" > "$key_path"
        chmod 600 "$key_path"
        GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
          git submodule update --init --recursive
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Verify private Core UI submodule
      run: npm run check:submodule
    - name: Run unit tests
      run: npm run test
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Build Next.js application
      run: npm run build
    - name: Start Next.js server
      run: npm run start &
    - name: Wait for Next.js server
      run: npx wait-on http://localhost:3000 --timeout 60000
    - name: Run Playwright tests
      run: npx playwright test
      env:
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        PORT: 3000
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
