name: Require Checks Before Merge

on:
  pull_request:
    branches:
      - master
      - develop
  pull_request_review:
    types:
      - submitted

jobs:
  Enforce-Requirements:
    name: Enforce PR Requirements
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: read
      statuses: read

    steps:
      - name: Check Required Reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const approvals = reviews.filter(r => r.state === 'APPROVED').length;
            const requiredApprovals = 1;

            console.log(`Approvals: ${approvals}/${requiredApprovals}`);

            if (approvals < requiredApprovals) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ **Merge Requirements Not Met**\n\n- Code Reviews: ${approvals}/${requiredApprovals} ✗\n\nPlease request review from team members.`
              });
              core.setFailed('Not enough approvals');
            }

      - name: Check Commit Signature
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const unsignedCommits = commits.filter(c => !c.commit.verification.verified);

            if (unsignedCommits.length > 0) {
              console.log(`⚠️ ${unsignedCommits.length} unsigned commits found`);
            } else {
              console.log('✅ All commits are signed');
            }

      - name: Check Test Coverage
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            const testRun = checkRuns.check_runs.find(c => c.name.includes('test') || c.name.includes('Test'));
            const lintRun = checkRuns.check_runs.find(c => c.name.includes('lint') || c.name.includes('Lint'));
            const buildRun = checkRuns.check_runs.find(c => c.name.includes('build') || c.name.includes('Build'));

            let status = '';
            if (testRun) status += `\n- Tests: ${testRun.conclusion === 'success' ? '✅' : '❌'}`;
            if (lintRun) status += `\n- Lint: ${lintRun.conclusion === 'success' ? '✅' : '❌'}`;
            if (buildRun) status += `\n- Build: ${buildRun.conclusion === 'success' ? '✅' : '❌'}`;

            if (status) {
              console.log('Check Status:' + status);
            }

      - name: Final Merge Status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let status = '## ✅ Merge Requirements\n\n';
            status += `- Status: ${pr.state === 'open' ? '✅ Open' : '❌ Closed'}\n`;
            status += `- Draft: ${pr.draft ? '❌ Yes' : '✅ No'}\n`;
            status += `- Conflict: ${pr.mergeable === false ? '❌ Yes' : '✅ No'}\n`;
            status += `- Behind master: ${pr.commits < 50 ? '✅ No' : '⚠️ Many commits'}\n`;

            console.log(status);

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: status
            });
