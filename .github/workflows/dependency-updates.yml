name: 의존성 패키지 업데이트 검사

on:
  schedule:
    - cron: '0 9 * * 1' # 매주 월요일 오후 6시 (KST / UTC 오전 9시)
  workflow_dispatch:

jobs:
  Dependency-Check:
    name: 업데이트 확인
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 오래된 패키지 확인
        id: outdated
        run: |
          npm outdated --json > outdated.json || true
          cat outdated.json

      - name: 의존성 리포트 생성
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const outdated = JSON.parse(fs.readFileSync('outdated.json', 'utf8'));

              if (Object.keys(outdated).length === 0) {
                console.log('✅ 모든 의존성 패키지가 최신 상태입니다!');
                return;
              }

              let report = '# 📦 업데이트 가능한 의존성 패키지 목록\n\n';
              report += '| 패키지명 | 현재 버전 | 최신 버전 | 구분 |\n';
              report += '|---------|---------|--------|------|\n';

              Object.entries(outdated).forEach(([pkg, info]) => {
                const type = info.type || 'dependency';
                report += `| \`${pkg}\` | ${info.current} | ${info.latest} | ${type} |\n`;
              });

              report += '\n## 🔍 통계 요약\n\n';
              report += `- 총 업데이트 대상: ${Object.keys(outdated).length}개\n`;

              let majors = 0, minors = 0, patches = 0;
              Object.entries(outdated).forEach(([pkg, info]) => {
                const curr = info.current.split('.');
                const latest = info.latest.split('.');

                if (curr[0] !== latest[0]) majors++;
                else if (curr[1] !== latest[1]) minors++;
                else patches++;
              });

              report += `- 메이저(Major) 업데이트: ${majors}개\n`;
              report += `- 마이너(Minor) 업데이트: ${minors}개\n`;
              report += `- 패치(Patch) 업데이트: ${patches}개\n`;

              console.log(report);
              core.setOutput('report', report);
            } catch (e) {
              console.log('업데이트 대상 패키지가 없습니다.');
            }

      - name: 업데이트 안내 이슈 생성
        if: steps.outdated.outputs.report != ''
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.outdated.outputs.report }}`;

            if (report.trim().length > 0) {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 의존성 패키지 업데이트 확인 필요',
                body: report + '\n\n---\n\n**조치 사항:**\n- [ ] 업데이트 내역 검토\n- [ ] `npm update` 실행\n- [ ] 기능 및 동작 테스트\n- [ ] 필요 시 PR 생성',
                labels: ['type:chore', 'dependencies']
              });

              console.log(`이슈 생성 완료: ${issue.html_url}`);
            }

      - name: 보안 취약점 감사 (Audit)
        run: |
          npm audit --audit-level=moderate || true

      - name: 보안 감사 리포트 생성
        run: |
          npm audit --json > audit.json || true
          cat audit.json | jq '.metadata.vulnerabilities'