name: 번들 크기 검사

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  Bundle-Analysis:
    name: 번들 크기 분석
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 패키지 설치
        run: npm ci

      - name: 프로덕션 빌드
        run: npm run build

      - name: 번들 크기 분석
        run: |
          echo "## 번들 크기 분석 결과" > bundle-report.md
          echo "" >> bundle-report.md
          echo "### Next.js 빌드 출력 크기" >> bundle-report.md
          echo "" >> bundle-report.md

          if [ -d ".next" ]; then
            du -sh .next >> bundle-report.md
            echo "" >> bundle-report.md
            echo "### 가장 큰 파일 상위 20개" >> bundle-report.md
            echo "" >> bundle-report.md
            find .next -type f -size +100k -exec du -h {} \; | sort -rh | head -20 >> bundle-report.md
          fi

      - name: 번들 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: bundle-report.md

      - name: 번들 크기 결과 댓글 등록
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bundle-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📦 번들 크기 분석 요약:\n\n' + report
            })