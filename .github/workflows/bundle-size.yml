name: Bundle Size Check

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  Bundle-Analysis:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production
        run: npm run build

      - name: Analyze Bundle Size
        run: |
          echo "## Bundle Size Analysis" > bundle-report.md
          echo "" >> bundle-report.md
          echo "### Next.js Output" >> bundle-report.md
          echo "" >> bundle-report.md

          if [ -d ".next" ]; then
            du -sh .next >> bundle-report.md
            echo "" >> bundle-report.md
            echo "### Largest Files" >> bundle-report.md
            echo "" >> bundle-report.md
            find .next -type f -size +100k -exec du -h {} \; | sort -rh | head -20 >> bundle-report.md
          fi

      - name: Upload Bundle Report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: bundle-report.md

      - name: Comment Bundle Size
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bundle-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📦 Bundle Size Analysis:\n\n' + report
            })
