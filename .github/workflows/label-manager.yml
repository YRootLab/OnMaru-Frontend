name: Smart Label Management

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited

jobs:
  Smart-Labels:
    name: Apply Smart Labels
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Ensure Label Colors Exist
        uses: actions/github-script@v7
        with:
          script: |
            const labelConfig = [
              { name: 'type:test', color: '0366d6', description: '✅ Test' },
              { name: 'type:docs', color: 'f0883e', description: '📝 Documentation' },
              { name: 'type:ci', color: 'ffd900', description: '⚙️ CI/CD' },
              { name: 'scope:code', color: '1f883d', description: 'Code changes' },
              { name: 'scope:styles', color: 'ff69b4', description: 'Style/CSS changes' },
              { name: 'size:xs', color: 'c2e0c6', description: 'Extra small' },
              { name: 'size:s', color: '90ee90', description: 'Small' },
              { name: 'size:m', color: 'ffd900', description: 'Medium' },
              { name: 'size:l', color: 'ff7f50', description: 'Large' },
              { name: 'size:xl', color: 'dc3545', description: 'Extra large' },
            ];

            for (const label of labelConfig) {
              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description
                    });
                  } catch (e) {
                    console.log(`Label setup skipped: ${label.name}`);
                  }
                }
              }
            }

      - name: Label by File Changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let labels = [];
            let totalAdditions = 0;
            let totalDeletions = 0;

            files.data.forEach(file => {
              totalAdditions += file.additions;
              totalDeletions += file.deletions;

              if (file.filename.includes('test') || file.filename.includes('spec')) {
                labels.push('type:test');
              }
              if (file.filename.includes('docs') || file.filename.includes('README')) {
                labels.push('type:docs');
              }
              if (file.filename.includes('.github') || file.filename.includes('workflow')) {
                labels.push('type:ci');
              }
              if (file.filename.includes('src/')) {
                labels.push('scope:code');
              }
              if (file.filename.includes('styles') || file.filename.includes('css') || file.filename.includes('.scss')) {
                labels.push('scope:styles');
              }
            });

            // Label by size with color-coded priority
            const changes = totalAdditions + totalDeletions;
            if (changes < 50) {
              labels.push('size:xs');
            } else if (changes < 100) {
              labels.push('size:s');
            } else if (changes < 300) {
              labels.push('size:m');
            } else if (changes < 600) {
              labels.push('size:l');
            } else {
              labels.push('size:xl');
            }

            if (labels.length > 0) {
              const uniqueLabels = [...new Set(labels)];
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: uniqueLabels
              });
            }

      - name: Ensure Title-Based Label Colors
        uses: actions/github-script@v7
        with:
          script: |
            const titleLabelConfig = [
              { name: 'type:bug-fix', color: 'd73a49', description: '🐛 Bug fix' },
              { name: 'type:feature', color: '28a745', description: '✨ New feature' },
              { name: 'type:refactor', color: '9366cc', description: '♻️ Refactor' },
              { name: 'type:chore', color: '6f42c1', description: '🔧 Chore' },
              { name: 'breaking-change', color: '000000', description: '💥 Breaking change' },
            ];

            for (const label of titleLabelConfig) {
              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description
                    });
                  } catch (e) {}
                }
              }
            }

      - name: Label by Title Keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            let labels = [];

            if (title.includes('fix') || title.includes('🐛')) {
              labels.push('type:bug-fix');
            }
            if (title.includes('feat') || title.includes('✨')) {
              labels.push('type:feature');
            }
            if (title.includes('refactor') || title.includes('♻️')) {
              labels.push('type:refactor');
            }
            if (title.includes('chore') || title.includes('🔧')) {
              labels.push('type:chore');
            }
            if (title.includes('breaking') || title.includes('💥')) {
              labels.push('breaking-change');
            }

            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

      - name: Comment with Labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issueData } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            if (issueData.labels && issueData.labels.length > 0) {
              const typeLabels = [];
              const sizeLabels = [];
              const scopeLabels = [];
              const otherLabels = [];

              issueData.labels.forEach(l => {
                if (l.name.startsWith('type:')) typeLabels.push(l.name);
                else if (l.name.startsWith('size:')) sizeLabels.push(l.name);
                else if (l.name.startsWith('scope:')) scopeLabels.push(l.name);
                else otherLabels.push(l.name);
              });

              let body = '🏷️ **Automatically Labeled**\n\n';

              if (typeLabels.length > 0) {
                body += `**Type:** ${typeLabels.map(l => `\`${l}\``).join(' ')}\n`;
              }
              if (sizeLabels.length > 0) {
                body += `**Size:** ${sizeLabels.map(l => `\`${l}\``).join(' ')}\n`;
              }
              if (scopeLabels.length > 0) {
                body += `**Scope:** ${scopeLabels.map(l => `\`${l}\``).join(' ')}\n`;
              }
              if (otherLabels.length > 0) {
                body += `**Other:** ${otherLabels.map(l => `\`${l}\``).join(' ')}\n`;
              }

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
