name: Smart Label Management

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited

jobs:
  Smart-Labels:
    name: Apply Smart Labels
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Label by File Changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let labels = [];
            let totalAdditions = 0;
            let totalDeletions = 0;

            files.data.forEach(file => {
              totalAdditions += file.additions;
              totalDeletions += file.deletions;

              if (file.filename.includes('test') || file.filename.includes('spec')) {
                labels.push('type:test');
              }
              if (file.filename.includes('docs') || file.filename.includes('README')) {
                labels.push('type:docs');
              }
              if (file.filename.includes('.github') || file.filename.includes('workflow')) {
                labels.push('type:ci');
              }
              if (file.filename.includes('src/')) {
                labels.push('scope:code');
              }
              if (file.filename.includes('styles') || file.filename.includes('css')) {
                labels.push('scope:styles');
              }
            });

            // Label by size
            const changes = totalAdditions + totalDeletions;
            if (changes < 50) {
              labels.push('size:xs');
            } else if (changes < 100) {
              labels.push('size:s');
            } else if (changes < 300) {
              labels.push('size:m');
            } else if (changes < 600) {
              labels.push('size:l');
            } else {
              labels.push('size:xl');
            }

            if (labels.length > 0) {
              const uniqueLabels = [...new Set(labels)];
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: uniqueLabels
              });
            }

      - name: Label by Title Keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            let labels = [];

            if (title.includes('fix') || title.includes('🐛')) {
              labels.push('type:bug-fix');
            }
            if (title.includes('feat') || title.includes('✨')) {
              labels.push('type:feature');
            }
            if (title.includes('refactor') || title.includes('♻️')) {
              labels.push('type:refactor');
            }
            if (title.includes('chore') || title.includes('🔧')) {
              labels.push('type:chore');
            }
            if (title.includes('breaking') || title.includes('💥')) {
              labels.push('breaking-change');
            }

            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

      - name: Comment with Labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issueData } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            if (issueData.labels && issueData.labels.length > 0) {
              const labelNames = issueData.labels.map(l => `\`${l.name}\``).join(' ');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🏷️ Automatically labeled: ${labelNames}`
              });
            }
