name: Create Develop Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request when one is not already open
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${branch}`;
            const { data: existingPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head,
              base: 'develop',
              state: 'open',
            });

            if (existingPullRequests.length > 0) {
              core.notice(`PR #${existingPullRequests[0].number} already tracks ${branch}.`);
              return;
            }

            const commits = context.payload.commits
              .map(({ id, message }) => `- ${id.slice(0, 7)} ${message.split('\n')[0]}`)
              .join('\n');
            const latestCommitSubject = context.payload.head_commit.message.split('\n')[0];
            try {
              const { data: pullRequest } = await github.rest.pulls.create({
                owner,
                repo,
                base: 'develop',
                head: branch,
                title: latestCommitSubject,
                body: [
                  '## 자동 생성 PR',
                  `- \`${branch}\` 브랜치의 최신 커밋을 \`develop\`에 반영합니다.`,
                  '',
                  '## 포함된 커밋',
                  commits,
                  '',
                  '## 관련 이슈',
                  '- 관련 이슈 번호와 검증 결과를 PR 설명에 추가해 주세요.',
                ].join('\n'),
              });

              core.notice(`Created PR #${pullRequest.number}.`);
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  'GitHub Actions is not allowed to create pull requests in repository settings. Create the PR manually or enable the repository setting.'
                );
                return;
              }
              throw error;
            }
