name: 이슈 자동 라벨 지정

on:
  issues:
    types:
      - opened
      - edited

jobs:
  이슈-라벨:
    name: 이슈 라벨 자동 지정
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: 제목 키워드로 라벨 지정
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];

            // 버그
            if (/bug|broken|crash|error|fail|오류|버그|에러|실패/.test(title))
              labels.push('type:bug');

            // 기능 요청
            if (/feature|add|support|enhance|기능|추가|요청/.test(title))
              labels.push('type:feature');

            // 문서
            if (/doc|readme|guide|문서/.test(title))
              labels.push('type:docs');

            // 성능
            if (/slow|performance|optimize|느림|성능|최적화/.test(title))
              labels.push('type:performance');

            // 리팩토링
            if (/refactor|cleanup|리팩/.test(title))
              labels.push('type:refactor');

            // 질문
            if (/\?|how|why|어떻게|왜|질문/.test(title))
              labels.push('type:question');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }

      - name: 이슈 라벨 색상 초기화
        uses: actions/github-script@v7
        with:
          script: |
            const labelConfig = [
              { name: 'type:bug',         color: 'd73a49', description: '🐛 버그 리포트' },
              { name: 'type:feature',     color: '28a745', description: '✨ 기능 요청' },
              { name: 'type:docs',        color: 'f0883e', description: '📝 문서' },
              { name: 'type:performance', color: 'ffd900', description: '⚡ 성능' },
              { name: 'type:refactor',    color: '9366cc', description: '♻️ 리팩토링' },
              { name: 'type:question',    color: '0366d6', description: '❓ 질문' },
              { name: 'priority:critical',color: 'b60205', description: '🔴 긴급' },
              { name: 'priority:high',    color: 'd73a49', description: '🟠 높음' },
              { name: 'priority:medium',  color: 'ffd900', description: '🟡 보통' },
              { name: 'priority:low',     color: 'cccccc', description: '⚪ 낮음' },
            ];

            for (const label of labelConfig) {
              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description
                    });
                  } catch (e) {}
                }
              }
            }

      - name: 우선순위 라벨 기본값 지정
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const hasPriority = issue.labels.some(l => l.name.startsWith('priority:'));
            if (!hasPriority) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['priority:medium']
              });
            }

      - name: 새 이슈 안내 댓글 등록
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.action === 'opened') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `👋 이슈를 열어주셔서 감사합니다!\n\n다음을 확인해주세요:\n- [ ] 기존 이슈 먼저 검색\n- [ ] 명확한 재현 단계 제공\n- [ ] 스크린샷/로그 첨부 (해당 시)\n- [ ] 환경 정보 기입 (OS, 브라우저, 버전)\n\n팀에서 검토 후 빠르게 답변드리겠습니다.`
              });
            }
