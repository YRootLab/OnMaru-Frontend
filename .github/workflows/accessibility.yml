name: 접근성 검사

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  Accessibility:
    name: 접근성 이슈 검사
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 패키지 설치
        run: npm ci

      - name: 애플리케이션 빌드
        run: npm run build

      - name: Axe DevTools 설치
        run: npm install --save-dev @axe-core/playwright || true

      - name: 접근성 테스트 실행
        run: |
          echo "접근성 검사를 실행 중입니다..."
          npx pa11y-ci .next || true
        continue-on-error: true

      - name: 접근성 보고서 생성
        run: |
          echo "# 접근성 감사 보고서" > a11y-report.md
          echo "" >> a11y-report.md
          echo "## 체크리스트" >> a11y-report.md
          echo "- [ ] 시맨틱 HTML 구조" >> a11y-report.md
          echo "- [ ] ARIA 레이블 및 역할(Role)" >> a11y-report.md
          echo "- [ ] 키보드 탐색 지원" >> a11y-report.md
          echo "- [ ] 색상 대비 비율" >> a11y-report.md
          echo "- [ ] 이미지 대체 텍스트(alt)" >> a11y-report.md
          echo "- [ ] 폼(Form) 레이블 제공 여부" >> a11y-report.md
          echo "- [ ] 포커스 인디케이터 표시" >> a11y-report.md

      - name: 접근성 보고서 업로드
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report.md

      - name: 접근성 검사 결과 댓글 등록
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '♿ 접근성 감사가 완료되었습니다. 아티팩트의 a11y-report를 확인하세요.'
            })