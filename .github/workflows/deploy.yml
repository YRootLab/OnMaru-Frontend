name: Vercel Direct Deployment

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
    tags:
      - 'release/**'
      - 'v*'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    name: Deploy to Production (master / v* tags)
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_READ_TOKEN: ${{ secrets.CORE_UI_READ_TOKEN }}
        run: |
          test -n "$CORE_UI_READ_TOKEN" || { echo "CORE_UI_READ_TOKEN is required to read src/private/core-ui."; exit 1; }
          git config --global url."https://x-access-token:${CORE_UI_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # ----------------------------------------------------------
      # 6. Clean old Vercel metadata
      # ----------------------------------------------------------
      - name: Clean Vercel metadata
        run: rm -rf .vercel

      - name: Prepare Vercel production metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ENVIRONMENT: production
        run: |
          node scripts/prepare-vercel-metadata.mjs

      # ----------------------------------------------------------
      # 8. Build
      # ----------------------------------------------------------
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  Deploy-Preview-or-Release:
    name: Deploy to Preview / Staging (develop / release/*)
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_READ_TOKEN: ${{ secrets.CORE_UI_READ_TOKEN }}
        run: |
          test -n "$CORE_UI_READ_TOKEN" || { echo "CORE_UI_READ_TOKEN is required to read src/private/core-ui."; exit 1; }
          git config --global url."https://x-access-token:${CORE_UI_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel preview metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ENVIRONMENT: preview
          VERCEL_GIT_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
        run: |
          node scripts/prepare-vercel-metadata.mjs

      # ----------------------------------------------------------
      # 8. Preview Build
      # ----------------------------------------------------------
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Preview / Release)
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
