name: Vercel Direct Deployment

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
    tags:
      - 'release/**'
      - 'v*'
  workflow_dispatch:

# Vercel 프로젝트 식별 정보
# 모든 step에서 자동으로 사용할 수 있음
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

  # ============================================================
  # Production
  # master 또는 v* 태그
  # ============================================================
  Deploy-Production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Repository Checkout
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. Private Core UI Submodule
      # ----------------------------------------------------------
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_READ_TOKEN: ${{ secrets.CORE_UI_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$CORE_UI_READ_TOKEN" || {
            echo "CORE_UI_READ_TOKEN is required to read src/private/core-ui."
            exit 1
          }

          git config --global \
            url."https://x-access-token:${CORE_UI_READ_TOKEN}@github.com/".insteadOf \
            "git@github.com:"

          git submodule sync --recursive
          git submodule update --init --recursive

      # ----------------------------------------------------------
      # 3. Node
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------------------------------------
      # 4. Vercel CLI
      # ----------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ----------------------------------------------------------
      # 5. Validate Secrets
      # ----------------------------------------------------------
      - name: Validate Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required Vercel secret: ${secret_name}"
              exit 1
            fi
          done

          echo "Vercel secrets are configured."

      # ----------------------------------------------------------
      # 6. Clean old Vercel metadata
      # ----------------------------------------------------------
      - name: Clean Vercel metadata
        run: rm -rf .vercel

      - name: Prepare Vercel production metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'EOF'
          const fs = require('node:fs/promises');
          const { URLSearchParams } = require('node:url');

          const {
            VERCEL_TOKEN,
            VERCEL_ORG_ID,
            VERCEL_PROJECT_ID,
          } = process.env;

          const apiBase = 'https://api.vercel.com';
          const headers = {
            Authorization: 'Bearer ' + VERCEL_TOKEN,
          };
          const search = new URLSearchParams({ source: 'github-actions-deploy' });

          if (VERCEL_ORG_ID.startsWith('team_')) {
            search.set('teamId', VERCEL_ORG_ID);
          }

          async function fetchText(path) {
            const response = await fetch(`${apiBase}${path}?${search.toString()}`, { headers });
            const text = await response.text();

            if (!response.ok) {
              throw new Error(`${response.status} ${response.statusText}: ${text}`);
            }

            return text;
          }

          async function fetchJson(path) {
            return JSON.parse(await fetchText(path));
          }

          function escapeValue(value) {
            return String(value ?? '')
              .replace(/\\/g, '\\\\')
              .replace(/"/g, '\\"')
              .replace(/\n/g, '\\n')
              .replace(/\r/g, '\\r');
          }

          function toDotenvContents(rawText) {
            try {
              const parsed = JSON.parse(rawText);
              if (parsed && typeof parsed === 'object' && parsed.env && typeof parsed.env === 'object' && !Array.isArray(parsed.env)) {
                return `# Created by Vercel CLI\n${Object.keys(parsed.env)
                  .sort()
                  .map((key) => `${key}="${escapeValue(parsed.env[key])}"`)
                  .join('\n')}\n`;
              }
            } catch {}

            return rawText.endsWith('\n') ? rawText : `${rawText}\n`;
          }

          async function main() {
            const [project, envPull] = await Promise.all([
              fetchJson(`/v9/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}`),
              fetchText(`/v3/env/pull/${encodeURIComponent(VERCEL_PROJECT_ID)}/production`),
            ]);

            const analyticsId =
              project.analytics?.id &&
              (!project.analytics.disabledAt ||
                (project.analytics.enabledAt &&
                  project.analytics.enabledAt > project.analytics.disabledAt))
                ? project.analytics.id
                : undefined;

            await fs.mkdir('.vercel', { recursive: true });
            await fs.writeFile(
              '.vercel/project.json',
              `${JSON.stringify(
                {
                  projectId: VERCEL_PROJECT_ID,
                  orgId: VERCEL_ORG_ID,
                  projectName: project.name,
                  settings: {
                    createdAt: project.createdAt,
                    framework: project.framework,
                    devCommand: project.devCommand,
                    installCommand: project.installCommand,
                    buildCommand: project.buildCommand,
                    outputDirectory: project.outputDirectory,
                    rootDirectory: project.rootDirectory,
                    directoryListing: project.directoryListing,
                    nodeVersion: project.nodeVersion,
                    analyticsId,
                  },
                },
                null,
                2,
              )}\n`,
            );
            await fs.writeFile(
              '.vercel/.env.production.local',
              toDotenvContents(envPull),
            );
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      # ----------------------------------------------------------
      # 8. Build
      # ----------------------------------------------------------
      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # ----------------------------------------------------------
      # 9. Production Deploy
      # ----------------------------------------------------------
      - name: Deploy Project Artifacts to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"


  # ============================================================
  # Preview / Staging
  #
  # develop
  # release/*
  # release/* tags
  # ============================================================
  Deploy-Preview-or-Release:
    name: Deploy to Preview / Staging

    if: >
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/release/')

    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Repository Checkout
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. Private Core UI Submodule
      # ----------------------------------------------------------
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_READ_TOKEN: ${{ secrets.CORE_UI_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$CORE_UI_READ_TOKEN" || {
            echo "CORE_UI_READ_TOKEN is required to read src/private/core-ui."
            exit 1
          }

          git config --global \
            url."https://x-access-token:${CORE_UI_READ_TOKEN}@github.com/".insteadOf \
            "git@github.com:"

          git submodule sync --recursive
          git submodule update --init --recursive

      # ----------------------------------------------------------
      # 3. Node
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------------------------------------
      # 4. Vercel CLI
      # ----------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ----------------------------------------------------------
      # 5. Validate Secrets
      # ----------------------------------------------------------
      - name: Validate Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required Vercel secret: ${secret_name}"
              exit 1
            fi
          done

          echo "Vercel secrets are configured."

      # ----------------------------------------------------------
      # 6. Clean old Vercel metadata
      # ----------------------------------------------------------
      - name: Clean Vercel metadata
        run: rm -rf .vercel

      - name: Prepare Vercel preview metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'EOF'
          const fs = require('node:fs/promises');
          const { URLSearchParams } = require('node:url');

          const {
            VERCEL_TOKEN,
            VERCEL_ORG_ID,
            VERCEL_PROJECT_ID,
          } = process.env;

          const apiBase = 'https://api.vercel.com';
          const headers = {
            Authorization: 'Bearer ' + VERCEL_TOKEN,
          };
          const search = new URLSearchParams({ source: 'github-actions-deploy' });

          if (VERCEL_ORG_ID.startsWith('team_')) {
            search.set('teamId', VERCEL_ORG_ID);
          }

          async function fetchText(path) {
            const response = await fetch(`${apiBase}${path}?${search.toString()}`, { headers });
            const text = await response.text();

            if (!response.ok) {
              throw new Error(`${response.status} ${response.statusText}: ${text}`);
            }

            return text;
          }

          async function fetchJson(path) {
            return JSON.parse(await fetchText(path));
          }

          function escapeValue(value) {
            return String(value ?? '')
              .replace(/\\/g, '\\\\')
              .replace(/"/g, '\\"')
              .replace(/\n/g, '\\n')
              .replace(/\r/g, '\\r');
          }

          function toDotenvContents(rawText) {
            try {
              const parsed = JSON.parse(rawText);
              if (parsed && typeof parsed === 'object' && parsed.env && typeof parsed.env === 'object' && !Array.isArray(parsed.env)) {
                return `# Created by Vercel CLI\n${Object.keys(parsed.env)
                  .sort()
                  .map((key) => `${key}="${escapeValue(parsed.env[key])}"`)
