name: Vercel Direct Deployment

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
    tags:
      - 'release/**'
      - 'v*'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    name: Deploy to Production (master / v* tags)
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_READ_TOKEN: ${{ secrets.CORE_UI_READ_TOKEN }}
        run: |
          test -n "$CORE_UI_READ_TOKEN" || { echo "CORE_UI_READ_TOKEN is required to read src/private/core-ui."; exit 1; }
          git config --global url."https://x-access-token:${CORE_UI_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required Vercel secret: ${secret_name}. Configure it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Link Vercel project metadata
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(".vercel").mkdir(parents=True, exist_ok=True)
          Path(".vercel/project.json").write_text(
              json.dumps(
                  {
                      "orgId": os.environ["VERCEL_ORG_ID"],
                      "projectId": os.environ["VERCEL_PROJECT_ID"],
                      "settings": {},
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify private Core UI submodule
        run: npm run check:submodule

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  Deploy-Preview-or-Release:
    name: Deploy to Preview / Staging (develop / release/*)
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_READ_TOKEN: ${{ secrets.CORE_UI_READ_TOKEN }}
        run: |
          test -n "$CORE_UI_READ_TOKEN" || { echo "CORE_UI_READ_TOKEN is required to read src/private/core-ui."; exit 1; }
          git config --global url."https://x-access-token:${CORE_UI_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required Vercel secret: ${secret_name}. Configure it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Link Vercel project metadata
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(".vercel").mkdir(parents=True, exist_ok=True)
          Path(".vercel/project.json").write_text(
              json.dumps(
                  {
                      "orgId": os.environ["VERCEL_ORG_ID"],
                      "projectId": os.environ["VERCEL_PROJECT_ID"],
                      "settings": {},
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify private Core UI submodule
        run: npm run check:submodule

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel (Preview / Release)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
