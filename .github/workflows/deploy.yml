name: Vercel Direct Deployment

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'release/**'
      - 'v*'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    name: Deploy to Production (main / v* tags)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_DEPLOY_KEY: ${{ secrets.CORE_UI_DEPLOY_KEY }}
        run: |
          test -n "$CORE_UI_DEPLOY_KEY" || { echo "CORE_UI_DEPLOY_KEY is required to read src/private/core-ui."; exit 1; }
          key_path="$RUNNER_TEMP/core-ui-deploy-key"
          printf '%s\n' "$CORE_UI_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  Deploy-Preview-or-Release:
    name: Deploy to Preview / Staging (develop / release/*)
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Initialize private Core UI submodule
        env:
          CORE_UI_DEPLOY_KEY: ${{ secrets.CORE_UI_DEPLOY_KEY }}
        run: |
          test -n "$CORE_UI_DEPLOY_KEY" || { echo "CORE_UI_DEPLOY_KEY is required to read src/private/core-ui."; exit 1; }
          key_path="$RUNNER_TEMP/core-ui-deploy-key"
          printf '%s\n' "$CORE_UI_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Preview / Release)
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
